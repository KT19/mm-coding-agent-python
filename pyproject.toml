[project]
name = "mm-coding-agent-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["agent", "core", "tools", "main.py"]
exclude = ["workspace", ".venv"]
